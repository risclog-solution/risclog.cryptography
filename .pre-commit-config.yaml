# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_language_version:
  python: python3.12

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:

    # These are the most critical checks.
    #
    - id: check-ast

    # Some basic sanitization.
    #
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-docstring-first
    - id: mixed-line-ending
      args: [--fix=lf]
    - id: debug-statements

    # Checking data formats.
    #
    - id: check-yaml
    - id: check-json
    - id: check-toml
    - id: check-xml

    # Check for secrets.
    #
    # - id: check-private-key
    # - id: detect-aws-credentials

    # Try to catch some faux-pas.
    #
    # - id: no-commit-to-branch
    #   args: [--branch, master]
    - id: check-added-large-files
      args: [--maxkb=1000]
    - id: check-merge-conflict
    - id: check-symlinks

    # Try to catch some more obscure things.
    #
    - id: check-executables-have-shebangs
    - id: check-case-conflict

    # This checks that all links to our VCS are permalinks. How oddly specific!
    - id: check-vcs-permalinks
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.14.14
    hooks:
    - id: ruff
      args: [--fix, --exit-non-zero-on-fix]
    - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/asottile/pyupgrade
    rev: v2.10.0
    hooks:
    - id: pyupgrade
      args: [--py36-plus]
  - repo: https://github.com/mgedmin/check-manifest
    rev: '0.50'
    hooks:
    - id: check-manifest
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        exclude: |
          (?x)^(
            tests/|
            docs/|
            \.egg-info/|
            build/
          )
        additional_dependencies:
          - pytest
          - pydantic
          - aiofiles
          - types-aiofiles
